<div class="container-fluid mt-4">
    <h2>Habitaciones</h2>

    <div class="d-flex justify-content-between mb-3">
        <button (click)="toggleForm()" class="btn btn-success">
            <i class="fa fa-plus"></i>
            Registrar Habitación
        </button>
    </div>

    <table class="table table-striped table-bordered mt-3">
        <thead class="table-dark">
            <tr style="text-align: center;">
                <th>#</th>
                <th>Número</th>
                <th>Tipo</th>
                <th>Precio</th>
                <th>Capacidad</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
        </thead>

        <tbody>
            <tr style="text-align: center;" *ngFor="let habitacion of listaHabitaciones; let i = index">

                <td>{{ i + 1 }}</td>
                <td>{{ habitacion.numeroHabitacion | number}}</td>
                <td>{{ habitacion.tipoHabitacion}}</td>
                <td>${{ habitacion.precio| number:'1.2-2' }}</td>
                <td>{{ habitacion.capacidad | number}}</td>
                <td>{{ habitacion.estadoHabitacion }}</td>

                <td>
                    <button class="btn btn-primary btn-sm me-1" (click)="editHabitacion(habitacion)">
                        <i class="fa fa-edit"></i> Editar
                    </button>

                    <button class="btn btn-info btn-sm me-1 text-white" (click)="editEstadoHabitacion(habitacion)">
                        <i class="fa fa-edit"></i>Estado
                    </button>

                    <button class="btn btn-danger btn-sm" (click)="deleteHabitacion(habitacion.id)">
                        <i class="fa fa-trash"></i> Eliminar
                    </button>
                </td>

            </tr>
        </tbody>
    </table>
</div>

<!-- MODAL -->

<div class="modal fade" #habitacionModalRef tabindex="-1" aria-labelledby="habitacionModalLabel" aria-hidden="true">

    <div class="modal-dialog modal-lg">
        <div class="modal-content">

            <div class="modal-header bg-dark text-white">
                <h5 class="modal-title" id="habitacionModalLabel">
                    {{ modalText }}
                </h5>

                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar">
                </button>
            </div>

            <div class="modal-body">

                <form [formGroup]="habitacionForm" (ngSubmit)="onSubmit()">

                    <!-- Fila 1 -->
                    <div class="row">

                        <div class="col-md-4 mb-3">
                            <label class="form-label"> Número Habitación </label>
                            <input class="form-control" formControlName="numeroHabitacion" type="number">
                        </div>

                        <div class="col-md-4 mb-3">
                            <label class="form-label"> Tipo Habitación (ID) </label>
                            <select class="form-select" formControlName="idTipoHabitacion">
                                <option value="">Seleccione...</option>
                                <option *ngFor="let tipo of tiposHabitacion" [value]="tipo.id">
                                    {{ tipo.descripcion }}
                                </option>
                            </select>
                        </div>

                    </div>

                    <!-- Fila 2 -->
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Precio</label>
                            <div class="input-group mb-3">
                                <span class="input-group-text">$</span>
                                <input type="number" class="form-control" placeholder="0.00" aria-label="Precio"
                                    aria-describedby="precio-addon" formControlName="precio">
                                <span class="input-group-text">MXN</span>
                            </div>
                        </div>

                        <div class="col-md-4 mb-3">
                            <label class="form-label"> Capacidad </label>
                            <input type="number" class="form-control" formControlName="capacidad">
                        </div>

                    </div>




                    <div class="text-end">
                        <button type="submit" class="btn btn-success" [disabled]="habitacionForm.invalid">
                            Guardar
                        </button>
                    </div>

                </form>

            </div>
        </div>
    </div>
</div>

<div class="modal fade" #EstadoHabitacionModalRef tabindex="-1" aria-labelledby="EstadoHabitacionModalRef"
    aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">

            <div class="modal-header bg-dark text-white">
                <h5 class="modal-title" id="EstadoHabitacionModalRef">
                    {{ modalText }}
                </h5>

                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar">
                </button>

            </div>
            <div class="modal-body">
                <form [formGroup]="EstadoHabitacionForm" (ngSubmit)="onSubmitEstado()">
                    <!-- Estado -->
                    <div class="col-md-4 mb-3">
                        <label class="form-label"> Estado Habitación </label>
                        <select class="form-select" formControlName="idEstadoHabitacion">
                            <option value="">Seleccione...</option>
                            <option *ngFor="let estado of EstadosHabitacion" [value]="estado.id">
                                {{ estado.descripcion }}
                            </option>
                        </select>
                    </div>


                    <div class="text-end">
                        <button type="submit" class="btn btn-success" [disabled]="EstadoHabitacionForm.invalid">
                            Guardar
                        </button>
                    </div>
                </form>

            </div>

        </div>
    </div>
</div>
