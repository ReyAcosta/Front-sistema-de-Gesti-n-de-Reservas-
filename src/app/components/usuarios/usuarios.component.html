<div class="main-content p-4 hotel-luxury-bg">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="section-title">Usuarios</h2>

    <button (click)="toggleForm()" class="btn btn-hotel-primary">
      <i class="fa-solid fa-plus me-2"></i>
      Registrar Usuario
    </button>
  </div>

  <table class="table hotel-table mt-3">
    <thead>
      <tr class="text-center">
        <th>#</th>
        <th>Username</th>
        <th>Roles</th>
        <th *ngIf="muestraAcciones">Acciones</th>
      </tr>
    </thead>

    <tbody>
      <tr class="text-center"
          *ngFor="let usuario of usuarios; let i = index">
        <td>{{ i + 1 }}</td>
        <td class="fw-semibold">{{ usuario.username }}</td>
        <td>
          <span *ngFor="let rol of usuario.roles"
                class="badge badge-hotel me-1">
            {{ transformarRol(rol) }}
          </span>
        </td>
        <td *ngIf="muestraAcciones">
          <button class="btn btn-delete"
                  (click)="deleteUsuario(usuario.username)">
            <i class="fa fa-trash me-1"></i>
            Eliminar
          </button>
        </td>
      </tr>
    </tbody>
  </table>

  <!-- MODAL -->
  <div class="modal fade"
       #usuarioModalRef
       tabindex="-1"
       aria-labelledby="usuarioModalLabel"
       aria-hidden="true">

    <div class="modal-dialog">
      <div class="modal-content hotel-modal">

        <div class="modal-header hotel-modal-header">
          <h5 class="modal-title">
            {{ textoModal }}
          </h5>
          <button type="button"
                  class="btn-close btn-close-white"
                  data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">
          <form [formGroup]="usuarioForm"
                (ngSubmit)="onSubmit()">

            <div class="mb-3">
              <label class="form-label-hotel">Username</label>
              <input class="form-control hotel-input"
                     formControlName="username"
                     minlength="5"
                     maxlength="20"
                     placeholder="Ingrese el nombre de usuario" />
            </div>

            <div class="mb-3">
              <label class="form-label-hotel">Contraseña</label>
              <input type="password"
                     class="form-control hotel-input"
                     formControlName="password"
                     minlength="8"
                     placeholder="Ingrese la contraseña" />
            </div>

            <div class="mb-3">
              <label class="form-label-hotel">Roles</label>
              <select class="form-select hotel-input"
                      formControlName="roles"
                      multiple size="3">
                <option *ngFor="let rol of roles"
                        [value]="rol">
                  {{ transformarRol(rol) }}
                </option>
              </select>
            </div>

            <div class="text-center mt-4">
              <button type="submit"
                      class="btn btn-hotel-primary px-4"
                      [disabled]="usuarioForm.invalid">
                <i class="fa fa-save me-1"></i>
                Guardar
              </button>
            </div>

          </form>
        </div>

      </div>
    </div>
  </div>

</div>
